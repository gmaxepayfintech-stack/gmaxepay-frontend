name: Deploy to Environments
on:
  push:
    branches:
      - development  
      - main       

jobs:
  deploy-development:
    if: github.ref == 'refs/heads/development'
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Install Dependencies
      run: npm install

    - name: Inject Development Environment Variables
      env:
        VITE_REACT_APP_API_ROUTE: ${{ secrets.VITE_DEV_REACT_APP_API_ROUTE }}
        # VITE_REACT_APP_ROUTE: ${{ secrets.VITE_DEV_REACT_APP_ROUTE }}
      run: |
        echo "VITE_REACT_APP_API_ROUTE=${VITE_REACT_APP_API_ROUTE}" > .env.development
        echo "VITE_REACT_APP_ROUTE=${VITE_REACT_APP_ROUTE}" >> .env.development

    - name: Deploy to Vercel (Preview)
      id: deploy-vercel
      env:
        VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
        VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      run: |
        npm install -g vercel
        vercel pull --yes --environment=preview --token=$VERCEL_TOKEN
        vercel build --token=$VERCEL_TOKEN
        DEPLOYMENT_URL=$(vercel deploy --prebuilt --token=$VERCEL_TOKEN)
        echo "deployment_url=$DEPLOYMENT_URL" >> $GITHUB_OUTPUT
        echo "✅ Deployed to preview: $DEPLOYMENT_URL"

    - name: Promote to Production
      env:
        VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      run: |
        DEPLOYMENT_URL="${{ steps.deploy-vercel.outputs.deployment_url }}"
        vercel promote $DEPLOYMENT_URL --token=$VERCEL_TOKEN --yes
        echo "✅ Promoted Development to Production: gmaxepayfrontend.vercel.app"

    - name: Clean Up Old Deployments
      env:
        VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      run: |
        # Get all deployments and keep only latest 3
        vercel ls --token=$VERCEL_TOKEN > deployments.txt
        
        # Extract deployment URLs (skip first 3 lines which are headers and latest deployments)
        tail -n +4 deployments.txt | awk '{print $1}' | while read -r deployment_url; do
          if [ ! -z "$deployment_url" ]; then
            echo "Deleting old deployment: $deployment_url"
            vercel rm $deployment_url --token=$VERCEL_TOKEN --yes || echo "Failed to delete $deployment_url"
          fi
        done

  deploy-production:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Install Dependencies
      run: npm install

    - name: Inject Production Environment Variables
      env:
        VITE_REACT_APP_API_ROUTE: ${{ secrets.VITE_REACT_APP_API_ROUTE }}
        VITE_REACT_APP_ROUTE: ${{ secrets.VITE_REACT_APP_ROUTE }}
      run: |
        echo "VITE_REACT_APP_API_ROUTE=${VITE_REACT_APP_API_ROUTE}" > .env.production
        echo "VITE_REACT_APP_ROUTE=${VITE_REACT_APP_ROUTE}" >> .env.production

    - name: Build Vite React App
      run: npm run build -- --mode production

    - name: Sync to S3
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        AWS_REGION: ${{ secrets.AWS_REGION }}
      run: |
        aws s3 sync ./dist s3://${{ secrets.S3_BUCKET_NAME }} --delete --region ${{ secrets.AWS_REGION }}

    - name: Invalidate CloudFront Cache
      continue-on-error: true
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        AWS_REGION: ${{ secrets.AWS_REGION }}
      run: |
        aws cloudfront create-invalidation \
          --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
          --paths "/*"